[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtrail"
version = "0.1.0"
description = "Agent Run-Trace-Evaluate Harness — test, observe, and compare your agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Runtrail Contributors" }]
keywords = ["agent", "evaluation", "benchmark", "trace", "harness", "hitl"]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
gateway = ["litellm>=1.40"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-http>=1.24"]
postgres = ["psycopg[binary]>=3.1"]
remote = ["httpx>=0.27"]
yaml = ["pyyaml>=6.0"]
schema = ["jsonschema>=4.0"]
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "psycopg[binary]>=3.1",
    "litellm>=1.40",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.0,<2",
    "langgraph>=0.2",
]

[project.scripts]
runtrail = "runtrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runtrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
